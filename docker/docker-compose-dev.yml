services:
  db:
    image: mysql:8.0
    container_name: yosoytupadel-db-dev
    environment:
      MYSQL_DATABASE: ${DB_NAME:-yosoytupadel_dev}
      MYSQL_USER: ${DB_USER:-padeluser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-padelpass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: vcandel/yosoytupadel:dev
    container_name: yosoytupadel-app-dev
    ports:
      - "8443:443"
    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-yosoytupadel_dev}
      DB_USER: ${DB_USER:-padeluser}
      DB_PASSWORD: ${DB_PASSWORD:-padelpass}
    depends_on:
      db:
        condition: service_healthy