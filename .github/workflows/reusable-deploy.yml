name: Reusable Build and Push

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag para la imagen Docker y el artefacto OCI'
        required: true
        type: string
      update_latest:
        description: 'Indica si se debe actualizar el tag latest'
        required: false
        type: boolean
        default: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar etiquetas (Tags)
        id: meta
        run: |
          TAGS="${{ secrets.DOCKERHUB_USERNAME }}/yosoytupadel:${{ inputs.tag }}"
          if [ "${{ inputs.update_latest }}" = "true" ]; then
            TAGS="$TAGS,${{ secrets.DOCKERHUB_USERNAME }}/yosoytupadel:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Instalar ORAS
        uses: oras-project/setup-oras@v1

      - name: Publicar docker-compose.yml como artefacto OCI
        run: |
          oras push registry-1.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/yosoytupadel-compose:${{ inputs.tag }} \
          docker/docker-compose.yml:application/vnd.docker.compose.file+yaml