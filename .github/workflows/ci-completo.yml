name: CI - Control de Calidad Completo

on:
  push:
    branches: [ "add-ci-workflow" ]
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

jobs:

  # --- JOB 1: BACKEND (Unitarios, Integración y SonarCloud opcional) ---
  backend-full-checks:
    name: Backend - Build, Unit & Integration Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar el proyecto
        run: mvn compile -DskipTests -B

      - name: Ejecutar Tests Unitarios del Backend
        run: mvn test -Dtest=*UnitTest,*ControllerTest,*ServiceTest -B

      - name: Ejecutar Tests de Integración (Testcontainers / Failsafe)
        run: mvn verify -Dsurefire.skip=true -B


  # --- JOB 2: FRONTEND (Unitarios, Build y SonarCloud) ---
  frontend-full-checks:
    name: Frontend - Build, Unit Tests & SonarCloud
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Tests Unitarios con Cobertura
        run: npx vitest run --coverage

      - name: Construir aplicación (Build Prod)
        run: npm run build

      - name: Análisis de Código Estático con SonarCloud
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ./frontend


  # --- JOB 3: TESTS DE SISTEMA / E2E (Selenium / Cypress / Playwright) ---
  system-e2e-tests:
    name: System & E2E Tests (Selenium)
    needs: [backend-full-checks, frontend-full-checks] # Se ejecuta solo si pasan los checks anteriores
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Levantar infraestructura local (Docker Compose - Base de datos)
        run: docker-compose up -d db

      - name: Iniciar Servidor Backend en segundo plano
        working-directory: ./backend
        run: mvn spring-boot:run &

      - name: Instalar dependencias y levantar Frontend en segundo plano
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          npm run preview -- --port 5173 &

      - name: Esperar a que los servicios estén listos
        run: sleep 15

      - name: Ejecutar Tests de Sistema (Selenium u otros)
        working-directory: ./backend

        run: mvn clean test