name: CI - Control de Calidad Completo

on:

  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:

  # --- JOB 1: BACKEND (Unitarios y Integración) ---
  backend-full-checks:
    name: Backend - Build, Unit & Integration Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar el proyecto
        run: mvn compile -DskipTests -B

      - name: Ejecutar Tests Unitarios del Backend
        run: mvn test -Dtest="!**/system/**" -B

      - name: Ejecutar Tests de Integración (Testcontainers / Failsafe)
        run: mvn verify -B



  # --- JOB 2: FRONTEND (Unitarios y Build) ---
  frontend-full-checks:
    name: Frontend - Build & Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Tests Unitarios con Cobertura
        run: npx vitest run --coverage

      - name: Construir aplicación (Build Prod)
        run: npm run build




  # --- JOB 3: TESTS DE SISTEMA / E2E (Selenium / Cypress / Playwright) ---
  system-e2e-tests:
    name: System & E2E Tests (Selenium)
    needs: [backend-full-checks, frontend-full-checks] # Se ejecuta solo si pasan los checks anteriores
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      #- name: Levantar infraestructura local (Docker Compose - Base de datos)
      #  run: docker-compose up -d db

      - name: Iniciar Servidor Backend en segundo plano
        working-directory: ./backend
        run: |
          nohup mvn spring-boot:run > /tmp/backend.log 2>&1 &

      - name: Instalar dependencias y levantar Frontend en segundo plano
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          nohup npm run preview -- --host 0.0.0.0 --port 5173 > /tmp/frontend.log 2>&1 &

      - name: Esperar a que los servicios estén listos
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              echo "Frontend disponible"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "El frontend no se inició correctamente"
              cat /tmp/frontend.log
              echo "Logs del backend:"
              cat /tmp/backend.log
              exit 1
            fi
            sleep 2
          done

      - name: Ejecutar Tests de Sistema (Selenium)
        working-directory: ./backend
        run: mvn verify -P e2e -Dsurefire.skip=true -B
