name: CI - Control de Calidad Básico

on:
  push:
    branches:
      - '**'
      #- '!main'
      #- '!master'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:

  # JOB 1: CONTROL DE CALIDAD DEL BACKEND.

  backend-checks:
    name: Backend - Build & Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Descargar dependencias de Maven
        run: mvn dependency:go-offline -B
        
      - name: Compilar el proyecto
        run: mvn compile -DskipTests

      - name: Ejecutar Tests Unitarios del Backend
        run: mvn test -Dtest=*UnitTest,*ControllerTest,*ServiceTest

  # JOB 2: CONTROL DE CALIDAD DEL CLIENTE (REACT) + SONARCLOUD

  frontend-checks:
    name: Frontend - Build, Unit Tests & SonarCloud
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Tests Unitarios con Cobertura
        # Ejecutamos Vitest en modo CI guardando la cobertura para SonarCloud
        run: npx vitest run --coverage

      - name: Construir aplicación (Build Prod)
        run: npm run build

      - name: Análisis de Código Estático con SonarCloud
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ./frontend