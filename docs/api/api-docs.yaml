openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/rackets:
    get:
      tags:
      - racket-controller
      operationId: getAllRackets
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Racket"
components:
  schemas:
    Racket:
      type: object
      properties:
        id:
          type: integer
          format: int64
        brand:
          type: string
        name:
          type: string
        description:
          type: string
        pricePerDay:
          type: number
          format: double
