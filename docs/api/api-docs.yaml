components:
  schemas:
    UserUpdateDTO:
      type: object
      properties:
        name:
          type: string
          maxLength: 2147483647
          minLength: 2
        nickname:
          type: string
          maxLength: 2147483647
          minLength: 2
        email:
          type: string
        sessionPrice:
          type: number
          format: double
    RacketDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        brand:
          type: string
        name:
          type: string
        description:
          type: string
        pricePerDay:
          type: number
          format: double
        stock:
          type: integer
          format: int32
    CourtDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        courtPrice:
          type: number
          format: double
        type:
          type: string
          enum:
          - INDOOR
          - OUTDOOR
        surface:
          type: string
          enum:
          - GLASS
          - WALL
        isAvailable:
          type: boolean
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nickname:
          type: string
        email:
          type: string
          description: Email address of the user
          example: john.doe@example.com
        password:
          type: string
          description: Password for authentication (write-only field)
          writeOnly: true
        role:
          type: string
          enum:
          - USER
          - COACH
          - ADMIN
        skillLevel:
          type: number
          format: double
        racketId:
          type: integer
          format: int64
        racketUsages:
          type: integer
          format: int32
        racketHistory:
          type: array
          items:
            $ref: "#/components/schemas/RacketDTO"
        sessionPrice:
          type: number
          format: double
      required:
      - email
      - password
    BookingDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        bookingDate:
          type: string
          format: date
        startTime:
          $ref: "#/components/schemas/LocalTime"
        endTime:
          $ref: "#/components/schemas/LocalTime"
        bookingPrice:
          type: number
          format: double
        type:
          type: string
          enum:
          - MATCH
          - TRAINING
        status:
          type: string
          enum:
          - PENDING
          - COMPLETED
          - CANCELLED
        score:
          type: string
        userId:
          type: integer
          format: int64
        courtId:
          type: integer
          format: int64
        coachId:
          type: integer
          format: int64
    LocalTime:
      type: object
      properties:
        hour:
          type: integer
          format: int32
        minute:
          type: integer
          format: int32
        second:
          type: integer
          format: int32
        nano:
          type: integer
          format: int32
    AuthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - SUCCESS
          - FAILURE
        message:
          type: string
        error:
          type: string
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    CoachDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        skillLevel:
          type: integer
          format: int32
        sessionPrice:
          type: number
          format: double
    PageCoachDTO:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/CoachDTO"
        number:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        sort:
          $ref: "#/components/schemas/SortObject"
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        unsorted:
          type: boolean
        sorted:
          type: boolean
    PagePreRacketDTO:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/PreRacketDTO"
        number:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        sort:
          $ref: "#/components/schemas/SortObject"
        empty:
          type: boolean
    PreRacketDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        brand:
          type: string
        name:
          type: string
        stock:
          type: integer
          format: int32
    PagePreCourtDTO:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/PreCourtDTO"
        number:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        sort:
          $ref: "#/components/schemas/SortObject"
        empty:
          type: boolean
    PreCourtDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        isAvailable:
          type: boolean
    CoachBookingDTO:
      type: object
      properties:
        booking:
          $ref: "#/components/schemas/BookingDTO"
        client:
          $ref: "#/components/schemas/UserDTO"
